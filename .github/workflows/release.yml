name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches the tag
        run: |
          expected="v$(cat VERSION)"
          if [[ "$expected" != "$GITHUB_REF_NAME" ]]; then
            echo "VERSION file ($expected) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Lint
        run: shellcheck -x vps-backup install.sh lib/*.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for details."
